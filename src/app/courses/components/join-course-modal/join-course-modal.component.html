@if (isVisible()) {
  <div class="fixed inset-0 z-40 flex items-center justify-center bg-black/50 p-4" role="dialog" aria-modal="true">
    <div class="w-full max-w-md rounded-lg bg-white p-6 shadow-xl">
      <div class="mb-6 flex items-center justify-between">
        <h2 class="text-xl font-semibold">Unirse al curso</h2>
        <button type="button" class="text-2xl leading-none" aria-label="Cerrar" (click)="onHide()">&times;</button>
      </div>

      <form [formGroup]="form" (submit)="onSubmit()">
        <label for="password" class="block">Contraseña:</label>
        <input formControlName="password" type="password" id="password" placeholder="Contraseña" class="form-input" />

        @if(formUtils.isValidField(form, 'password')) {
          <p class="label text-sm text-red-600">{{formUtils.getFieldError(form, 'password')}}</p>
        }

        <button type="submit" class="mt-6 w-full cursor-pointer bg-blue-800 p-2 text-white">Unirse</button>
      </form>
    </div>
  </div>
}
